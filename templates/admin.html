<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Seller Dashboard{% endblock title %}</title>

    {% load static %}
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter & Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons: Bootstrap & BoxIcons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/boxicons/2.1.0/css/boxicons.min.css'>
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- Custom Sidebar Styles -->
    <link rel="stylesheet" href="{% static 'css/admin_styles.css' %}">
</head>
<body>

  <nav class="sidebar close">
    <header>
      <div class="image-text">
        <span class="image">
          <img src="{% static 'logo.png' %}" alt="Logo">
        </span>
  
        <div class="text logo-text">
          <span class="name">DEALS.COM </span>
        </div>
      </div>
  
      <i class='bx bx-chevron-right toggle'></i>
    </header>
  
    <div class="menu-bar">
      <div class="menu">
        <ul class="menu-links p-0">
          <li class="nav-link-item">
            <a href="/">
              <i class='bx bx-home-alt icon'></i>
              <span class="text nav-text">Home</span>
            </a>
          </li>
  
          <li class="nav-link-item">
            <a href="/dashboard">
                <i class='bx bx-list-ul icon'></i>
              <span class="text nav-text">Deals</span>
            </a>
          </li>
          
          <li class="nav-link-item">
            <a href="#">
              <i class='bx bx-bell icon'></i>
              <span class="text nav-text">Notifications</span>
            </a>
          </li>
  
          <li class="nav-link-item">
            <a href="/services">
              <i class='bx bx-support icon'></i>
              <span class="text nav-text">Services</span>
            </a>
          </li>

          <li class="nav-link-item">
            <a href="/banner">
              <i class='bx bx-wallet icon'></i>
              <span class="text nav-text">Add Banner</span>
            </a>
          </li>
          
          <li class="nav-link-item">
            <a href="#">
              <i class='bx bx-heart icon'></i>
              <span class="text nav-text">Likes and Reviews</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="bottom-content">
        {% block logout %}
        <li class="nav-link-item">
          <a href="/logout">
            <i class='bx bx-log-out icon'></i>
            <span class="text nav-text">Logout</span>
          </a>
        </li>
        {% endblock logout %}
      
        <li class="mode nav-link-item">
          <div class="sun-moon">
            <i class='bx bx-moon icon moon'></i>
            <i class='bx bx-sun icon sun'></i>
          </div>
          <span class="mode-text text">Dark mode</span>
  
          <div class="toggle-switch">
            <span class="switch"></span>
          </div>
        </li>
      </div>
    </div>
  </nav>

  <main class="dashboard-content">
    {% block view %}{% endblock %}
    {% block body %}{% endblock %}
  </main>

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    const body = document.querySelector("body"),
          sidebar = body.querySelector("nav"),
          toggle = body.querySelector(".toggle"),
          modeSwitch = body.querySelector(".toggle-switch"),
          modeText = body.querySelector(".mode-text");
  
    toggle.addEventListener("click", () => {
      sidebar.classList.toggle("close");
    });
  
    modeSwitch.addEventListener("click", () => {
      body.classList.toggle("dark");
      if (body.classList.contains("dark")) {
        modeText.innerText = "Light mode";
      } else {
        modeText.innerText = "Dark mode";
      }
    });

    // Sweet Alert for Django Messages
    {% if messages %}
      {% for message in messages %}
        Swal.fire({
          position: 'top-end',
          icon: '{{ message.tags }}' === 'error' ? 'error' : ('{{ message.tags }}' === 'success' ? 'success' : 'info'),
          title: '{{ message }}',
          showConfirmButton: false,
          timer: 3000,
          toast: true
        });
      {% endfor %}
    {% endif %}
  </script>

</body>
</html>
