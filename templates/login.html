{% extends "base.html" %}
{% load static %}

{% block title %}Seller Login{% endblock title %}

{% block loginBody %}
<style>
    .auth-page {
        min-height: calc(100vh - 100px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    .auth-card {
        background: #fff;
        border: none;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        width: 100%;
        max-width: 450px;
        overflow: hidden;
    }

    .auth-header {
        background: linear-gradient(135deg, #0d6efd, #0056b3);
        padding: 3rem 2rem;
        text-align: center;
        color: #fff;
    }

    .auth-header h1 {
        font-family: 'Montserrat', sans-serif;
        font-weight: 800;
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
        color: #fff;
    }

    .auth-header p {
        opacity: 0.9;
        font-size: 0.9rem;
        margin-bottom: 0;
    }

    .auth-body {
        padding: 3rem 2.5rem;
    }

    .form-control {
        border-radius: 12px;
        border: 1.5px solid #eee;
        padding: 0.75rem 1rem;
        transition: all 0.2s ease;
    }

    .form-control:focus {
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1);
        border-color: #0d6efd;
    }

    .form-floating > label {
        padding-left: 1rem;
        color: #636e72;
    }

    .form-floating > .form-control:focus ~ label,
    .form-floating > .form-control:not(:placeholder-shown) ~ label {
        color: #0d6efd;
        opacity: 0.8;
    }

    .btn-login {
        background: #0d6efd;
        border: none;
        border-radius: 12px;
        padding: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-top: 1rem;
        transition: all 0.3s ease;
        color: white;
    }

    .btn-login:hover {
        background: #0056b3;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 86, 179, 0.2);
        color: white;
    }

    .auth-footer {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.9rem;
        color: #636e72;
    }

    .auth-footer a {
        color: #0d6efd;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }

    /* Animation */
    .fade-in {
        animation: fadeIn 0.6s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<div class="auth-page">
    <div class="container d-flex justify-content-center">
        <div class="auth-card fade-in">
            <div class="auth-header">
                <i class="bi bi-shield-lock fs-1 mb-3 d-block text-white"></i>
                <h1>Welcome Back</h1>
                <p>Login to your seller dashboard to manage deals</p>
            </div>
            <div class="auth-body">
                <form method="POST" action="/login/">
                    {% csrf_token %}
                    
                    <div class="form-floating mb-4">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                        <label for="username"><i class="bi bi-person me-2"></i>Username</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password"><i class="bi bi-key me-2"></i>Password</label>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="remember-me" id="rememberMe">
                            <label class="form-check-label small text-muted" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="#" class="small text-primary fw-semibold text-decoration-none">Forgot Password?</a>
                    </div>

                    <button class="btn btn-primary w-100 btn-login text-white" type="submit">
                        SIGN IN <i class="bi bi-arrow-right ms-2"></i>
                    </button>

                    <div class="auth-footer">
                        Not a Seller? <a href="/contact">Register Now</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock loginBody %}
