{% extends './admin.html' %}

{% block title %}Add New Deal{% endblock title %}

{% block body %}
<style>
    .form-container {
        background: #fff;
        border-radius: 24px;
        padding: 3rem;
        box-shadow: 0 10px 40px rgba(0,0,0,0.05);
        max-width: 800px;
        margin: 2rem auto;
    }
    .form-label { font-weight: 600; color: #2d3436; }
    .form-control { border-radius: 12px; border: 1.5px solid #eee; padding: 0.75rem 1rem; }
    .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 4px rgba(13,110,253,0.08); }
    
    .fade-in {
        animation: fadeIn 0.5s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<section class="home px-4">
    <div class="form-container fade-in">
        <h2 class="fw-bold mb-4 text-primary"><i class="bi bi-plus-circle me-2"></i>Hurray, New Deal!</h2>
        <p class="text-muted mb-5">Fill in the details below to publish your new promotion.</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row g-4">
                <div class="col-12">
                    <label for="title" class="form-label">Deal Title</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="e.g. 50% Off on Electronics" required>
                </div>
                
                <div class="col-12">
                    <label for="description" class="form-label">Detailed Description</label>
                    <textarea class="form-control" id="description" name="description" rows="4" placeholder="Tell users more about this deal..." required></textarea>
                </div>

                <div class="col-md-6">
                    <label for="code" class="form-label">Promo Code (Optional)</label>
                    <input type="text" class="form-control" id="code" name="code" placeholder="e.g. SAVE50">
                </div>

                <div class="col-md-6">
                    <label for="images" class="form-label">Deal Image</label>
                    <input type="file" class="form-control" id="images" name="images" required>
                    <div class="form-text">Recommended size: 800x600px</div>
                </div>

                <div class="col-12">
                    <label for="url" class="form-label">Destination Link (URL)</label>
                    <input type="url" class="form-control" id="url" name="link" placeholder="https://example.com/..." required>
                </div>

                <div class="col-12 mt-5">
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm">
                        PUBLISH DEAL <i class="bi bi-send ms-2"></i>
                    </button>
                    <a href="{% url 'dashboard' %}" class="btn btn-light w-100 py-3 rounded-3 fw-bold mt-3 border text-decoration-none text-center">
                        CANCEL
                    </a>
                </div>
            </div>
        </form>
    </div>
</section>
{% endblock body %}
